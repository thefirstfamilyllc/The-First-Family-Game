<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The First Family — 3D World Development</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0917;color:white;font:600 14px system-ui}#viewport{width:100%;height:100%}#hud{position:fixed;top:12px;left:12px;right:12px;pointer-events:none;display:flex;justify-content:space-between;gap:12px}#hud div{background:#160c2ad9;border:1px solid #d5a84c;border-radius:12px;padding:10px 15px}button{pointer-events:auto;border:1px solid #f6c65d;border-radius:18px;background:#4a126d;color:#fff;padding:10px;cursor:pointer}#controls{position:fixed;bottom:18px;left:12px;right:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#controls button{min-width:75px}#note{position:fixed;top:66px;left:12px;max-width:330px;color:#e6d4f4;font-weight:400;font-size:12px}</style></head><body><div id="viewport"></div><div id="hud"><div>THE FIRST FAMILY · 3D WORLD</div><div>INTERIOR DEVELOPMENT</div></div><div id="note">3D development build. Drag to look around; use the arrows to move.</div><div id="controls"><button id="left">◀</button><button id="forward">▲ FORWARD</button><button id="back">▼ BACK</button><button id="right">▶</button><button id="reset">RESET VIEW</button></div><script type="module">
import * as T from 'https://esm.sh/three@0.160.1';
import {GLTFLoader} from 'https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color(0x100b20);scene.fog=new T.FogExp2(0x130c23,.018);
const camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.08,140);camera.position.set(0,2.4,11);camera.lookAt(0,1.7,-7);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.querySelector('#viewport').appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x70587a,4.5));const fill=new T.DirectionalLight(0xffe6bc,4.2);fill.position.set(2,8,8);scene.add(fill);const bounce=new T.DirectionalLight(0xd5b6ff,3);bounce.position.set(-8,5,-2);scene.add(bounce);
const mat=(c,m=0,r=.4)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const black=mat(0x17121e,.4,.18),gold=mat(0xe8b853,.75,.24),silver=mat(0xb6b8c5,.9,.21),wall=mat(0x31243a,.18,.7),purple=mat(0x4c176c,.32,.3),glass=new T.MeshPhysicalMaterial({color:0x8ca9df,metalness:.1,roughness:.08,transmission:.55,transparent:true,opacity:.35,side:T.DoubleSide}),lightmat=new T.MeshBasicMaterial({color:0xf8cb8b});
function mesh(g,m,x,y,z,par=scene){let a=new T.Mesh(g,m);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;par.add(a);return a}
function box(w,h,d,x,y,z,m,p){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}
function cyl(r1,r2,h,x,y,z,m,p){return mesh(new T.CylinderGeometry(r1,r2,h,48),m,x,y,z,p)}
function tor(r,t,x,y,z,m,p){return mesh(new T.TorusGeometry(r,t,14,64),m,x,y,z,p)}
const floor=new T.Mesh(new T.PlaneGeometry(32,36),new T.MeshPhysicalMaterial({color:0x28202f,metalness:.62,roughness:.16,clearcoat:1,clearcoatRoughness:.12}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
for(let i=-15;i<=15;i+=3){box(.018,.004,35,i,.005,-5,mat(0x59475b,.25,.25));box(32,.004,.018,0,.005,i-5,mat(0x59475b,.25,.25))}
box(32,10,.35,0,5,-20,wall);box(.35,10,35,-16,5,-3,wall);box(.35,10,35,16,5,-3,wall);box(32,.25,35,0,10,-3,black);
for(let i=-14;i<=14;i+=4){const l=new T.PointLight(i%8?0xffbd6b:0xb34cff,22,12);l.position.set(i,8,-9);l.castShadow=false;scene.add(l);cyl(.75,.75,.1,i,9.6,-9,black);cyl(.63,.63,.05,i,9.5,-9,lightmat)}
for(let i=-13;i<=13;i+=3){const strip=box(2.4,.045,.12,i,7.4,-19.76,new T.MeshBasicMaterial({color:0xb947f8}));strip.castShadow=false}
for(let side of [-1,1]){for(let i=0;i<7;i++){let z=-16+i*3.1;const g=new T.Group();g.position.set(side*12.3,0,z);g.rotation.y=side===1?-Math.PI/2:Math.PI/2;scene.add(g);box(2.55,3.55,1.8,0,1.8,0,silver,g);box(2.32,2.8,.12,0,2.05,.96,black,g);let door=cyl(.94,.94,.13,0,2.1,1.07,silver,g);door.rotation.x=Math.PI/2;let ring=tor(.76,.075,0,2.1,1.17,gold,g);let drum=cyl(.68,.68,.1,0,2.1,1.18,glass,g);drum.rotation.x=Math.PI/2;let hub=cyl(.22,.22,.13,0,2.1,1.26,black,g);hub.rotation.x=Math.PI/2;box(2.1,.33,.08,0,3.38,1.03,purple,g);for(let j=0;j<3;j++)cyl(.08,.08,.03,-.65+j*.27,3.38,1.09,lightmat,g)}}
for(let i=0;i<3;i++){box(2.4,.2,1.4,-5+i*5,1,-7,gold);for(let j of [-1,1])cyl(.09,.09,1,-5+i*5+j*.9,.5,-7,black)}
for(let x of [-11,11]){box(2,.35,1.3,x,.4,4,purple);box(2,.7,1.1,x,1,4,black);box(.2,.8,1.1,x-1,1.15,4,black);box(.2,.8,1.1,x+1,1.15,4,black)}
for(let i=0;i<4;i++){const c=cyl(.72,.72,.14,-5+i*3,.88,2,mat(i%2?0x6b2790:0xede8e7,.05,.85));c.rotation.z=Math.PI/2}
const sign=document.createElement('canvas');sign.width=1536;sign.height=384;const c=sign.getContext('2d');c.fillStyle='#2c123c';c.fillRect(0,0,1536,384);c.strokeStyle='#dca94e';c.lineWidth=18;c.strokeRect(12,12,1512,360);c.textAlign='center';c.fillStyle='#ffd27a';c.shadowColor='#f8aaff';c.shadowBlur=30;c.font='italic bold 150px Georgia';c.fillText('The First Family',768,200);c.shadowBlur=0;c.fillStyle='#fff1ca';c.font='bold 54px Arial';c.fillText('PICK-UP & DELIVERY · LAUNDRY SERVICE',768,300);const tex=new T.CanvasTexture(sign);tex.colorSpace=T.SRGBColorSpace;mesh(new T.PlaneGeometry(11,2.75),new T.MeshBasicMaterial({map:tex}),0,6,-19.5);
const pad=cyl(1.7,1.8,.18,0,.12,2,purple);const rim=tor(1.72,.06,0,.24,2,new T.MeshBasicMaterial({color:0xf9b64b}));rim.rotation.x=Math.PI/2;
let avatar,mixer;new GLTFLoader().load('./model%203.glb',g=>{avatar=g.scene;const bounds=new T.Box3().setFromObject(avatar),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());avatar.position.sub(center);avatar.position.y+=size.y/2;avatar.scale.multiplyScalar(3.35/size.y);avatar.position.z=2;scene.add(avatar);if(g.animations?.length){mixer=new T.AnimationMixer(avatar);const clip=g.animations.find(a=>/idle|breath|stand|walk/i.test(a.name))||g.animations[0];mixer.clipAction(clip).play()}},undefined,()=>{});
let yaw=0,pitch=0;const point=new T.Vector3(0,1.7,-7);function look(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}look();const held=new Set();for(let id of ['left','right','forward','back']){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();held.add(id)});for(let ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>held.delete(id))}
document.getElementById('reset').onclick=()=>{camera.position.set(0,2.4,11);yaw=0;pitch=0;look()};
let down=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;yaw-=(e.clientX-px)*.003;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-py)*.003));px=e.clientX;py=e.clientY;look()});renderer.domElement.addEventListener('pointerup',()=>down=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-prev)/1000);prev=now;if(mixer)mixer.update(dt);const speed=dt*4;const forward=new T.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),right=new T.Vector3(Math.cos(yaw),0,Math.sin(yaw));if(held.has('forward'))camera.position.addScaledVector(forward,speed);if(held.has('back'))camera.position.addScaledVector(forward,-speed);if(held.has('left'))camera.position.addScaledVector(right,-speed);if(held.has('right'))camera.position.addScaledVector(right,speed);camera.position.x=T.MathUtils.clamp(camera.position.x,-14,14);camera.position.z=T.MathUtils.clamp(camera.position.z,-17,14);renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
