<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The First Family — Page 2</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0c0716;color:white;font-family:system-ui}body{min-height:100dvh;display:grid;place-items:center}.scene{position:relative;width:min(100vw,177.78dvh);aspect-ratio:16/9;background:url('57C3B01C-09FF-4847-9937-1C25A3A95C23.png') center/100% 100% no-repeat}.hit{position:absolute;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hit:focus-visible{outline:2px solid #ffca45;border-radius:12px}.dots{position:absolute;left:47.1%;top:96.2%;display:flex;gap:8px;pointer-events:none}.dots i{width:9px;height:9px;border-radius:50%;background:#786c89}.dots i.on{background:#ffca43;box-shadow:0 0 8px #ffc744}.select-label{position:absolute;left:40.1%;top:89%;width:20%;height:6%;display:grid;place-items:center;color:#fff;font-size:clamp(9px,1.6vw,22px);font-weight:900;pointer-events:none;text-shadow:0 1px 3px #17001f}.dialog{position:fixed;inset:0;display:none;place-items:center;background:#09040ccc;z-index:10;padding:16px}.dialog.open{display:grid}.panel{width:min(440px,100%);padding:22px;border:2px solid #dca73f;border-radius:20px;background:linear-gradient(#361349,#130a24);box-shadow:0 10px 50px #000}.panel h2{margin:0 0 12px}.panel button{border:1px solid #e3b350;background:#54217b;color:white;border-radius:12px;padding:12px;margin:5px;cursor:pointer}.panel button.active{background:#a45d15}.panel p{font-size:13px;color:#e4d8eb}.status{margin-top:10px;color:#ffd777}
@media(orientation:portrait){body{display:block;overflow-x:hidden}.scene{width:100vw;min-height:0;margin-top:calc((100dvh - 56.25vw)/2)}.dots{gap:4px}.dots i{width:5px;height:5px}}
</style></head><body><main class="scene" aria-label="The First Family character selection">
<button class="hit" style="left:3%;top:36%;width:22%;height:5.4%" data-person="0" aria-label="Jay"></button><button class="hit" style="left:3%;top:42%;width:22%;height:5.4%" data-person="1" aria-label="Esined"></button><button class="hit" style="left:3%;top:48%;width:22%;height:5.4%" data-person="2" aria-label="Jahdē"></button>
<button class="hit" style="left:34%;top:86%;width:5%;height:8%" id="prev" aria-label="Previous character"></button><button class="hit" style="left:61%;top:86%;width:5%;height:8%" id="next" aria-label="Next character"></button><button class="hit" style="left:40%;top:86%;width:20%;height:9%" id="select" aria-label="Select character"></button><div class="select-label" id="label">♛ SELECT JAY</div><div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
<button class="hit" style="left:79%;top:81%;width:20%;height:8%" id="customize" aria-label="Customize"></button><button class="hit" style="left:79%;top:89%;width:20%;height:9%" id="accept" aria-label="Accept character"></button><button class="hit" style="left:1%;top:89%;width:12%;height:10%" id="back" aria-label="Back"></button></main>
<div class="dialog" id="dialog"><div class="panel"><h2 id="title">Customize Jay</h2><p>Choose outfit color</p><div id="outfits"><button data-color="Purple">Purple</button><button data-color="Green">Green</button><button data-color="Black">Black</button></div><button id="hair">Change hairstyle</button><button id="hat">Hat: Off</button><p>Customization choices are saved. Visual clothing changes require separate character artwork or models.</p><button id="done">DONE</button></div></div>
<div class="dialog" id="confirm"><div class="panel"><h2 id="confirmTitle">Character accepted</h2><p>Your selection is saved for gameplay.</p><button id="continue">CONTINUE TO GAME</button><button id="closeConfirm">BACK TO SELECTION</button><div class="status" id="status"></div></div></div>
<script>
const names=['Jay','Esined','Jahdē'];let current=0;const prefs=JSON.parse(localStorage.getItem('tffCharacterOptions')||'{}');const $=id=>document.getElementById(id);function refresh(){ $('label').textContent='♛ SELECT '+names[current].toUpperCase();$('title').textContent='Customize '+names[current];$('dots').querySelectorAll('i').forEach((e,i)=>e.classList.toggle('on',i===current));}function choose(i){current=(i+3)%3;refresh()}document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>choose(+b.dataset.person));$('prev').onclick=()=>choose(current-1);$('next').onclick=()=>choose(current+1);$('select').onclick=()=>{$('label').textContent='♛ SELECT '+names[current].toUpperCase()};$('customize').onclick=()=>{$('dialog').classList.add('open');refresh()};$('done').onclick=()=>{$('dialog').classList.remove('open');localStorage.setItem('tffCharacterOptions',JSON.stringify(prefs))};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{(prefs[names[current]]??={}).color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===b))});$('hair').onclick=()=>{const p=prefs[names[current]]??={};p.hair=(p.hair||0)+1;$('hair').textContent='Hairstyle '+p.hair};$('hat').onclick=()=>{const p=prefs[names[current]]??={};p.hat=!p.hat;$('hat').textContent='Hat: '+(p.hat?'On':'Off')};$('accept').onclick=()=>{localStorage.setItem('tffSelectedCharacter',names[current]);localStorage.setItem('tffCharacterOptions',JSON.stringify(prefs));$('confirmTitle').textContent=names[current]+' accepted';$('confirm').classList.add('open')};$('closeConfirm').onclick=()=>{$('confirm').classList.remove('open')};$('continue').onclick=()=>{location.href='./index.html#game'};$('back').onclick=()=>{location.href='./index.html'};refresh();
</script></body></html>
