name: Build 3D Godot preview

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/build-3d-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install web export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Import game resources
        run: godot --headless --path godot --editor --quit
      - name: Export web build
        run: |
          mkdir -p 3d
          godot --headless --path godot --export-release "Web" ../3d/index.html
          test -s 3d/index.html
      - name: Publish preview alongside existing site
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 3d/
          if ! git diff --cached --quiet; then
            git commit -m "Build latest 3D Godot web preview [skip ci]"
            git push
          fi
