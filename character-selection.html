st buttons=[...document.querySelectorAll('[data-character]')];const toast=document.getElementById('toast');let hide;function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(hide);hide=setTimeout(()=>toast.classList.remove('show'),2400)}function choose(i){selected=(i+3)%3;buttons.forEach((b,j)=>b.classList.toggle('selected',j===selected));notify(names[selected]+' selected')}buttons.forEach((b,i)=>b.onclick=()=>{sessionStorage.setItem('tffSelectedCharacter',String(i));location.href='customize-character.html?character='+i});document.getElementById('prev').onclick=()=>choose(selected-1);document.getElementById('next').onclick=()=>choose(selected+1);document.getElementById('confirm').onclick=()=>{sessionStorage.setItem('tffSelectedCharacter',String(selected));sessionStorage.setItem('tffCustomization',JSON.stringify(customize));location.href='customize-character.html?character='+selected};document.getElementById('back').onclick=()=>{location.href='index.html'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>notify(b.dataset.tab+' controls require interactive 3D models'));
// Real selection state and on-screen appearance preview controls.
// Keep the approved full-screen art untouched: all changes live in an overlay.
const customize={skin:2,hair:0,hairColor:0,outfit:0,gear:0,style:0};
const config={
 Appearance:{label:'Skin tone',key:'skin',values:['#f2c5a3','#d79b75','#ae714e','#805038','#513023']},
 Outfits:{label:'Outfit color',key:'outfit',values:['#67209c','#21252f','#65bd16','#d34979','#e7b146']},
 Gear:{label:'Accessories',key:'gear',values:['None','Glasses','Cap','Headphones']},
 Style:{label:'Hair color',key:'hairColor',values:['#241918','#70432c','#b46c35','#e4c285','#a8a8ad']}
};
const panel=document.createElement('section');
panel.id='customPanel';panel.setAttribute('aria-label','Appearance customization');
panel.style.cssText='position:absolute;z-index:12;right:1.5%;top:20%;width:36%;max-height:57%;overflow:auto;border-radius:16px;background:rgba(39,4,66,.96);border:2px solid #b95df1;padding:12px;color:white;font:600 14px system-ui;box-shadow:0 5px 22px #17032688;display:none';
document.querySelector('.stage').append(panel);
const portrait=document.createElement('div');portrait.id='portraitPreview';
portrait.style.cssText='position:absolute;z-index:10;left:36%;top:20%;width:18%;height:33%;pointer-events:none;display:none;border:3px solid #9cfa00;border-radius:18px;box-shadow:0 0 15px #9cfa00;overflow:hidden;background:#411363';
document.querySelector('.stage').append(portrait);
const picture=document.createElement('img');picture.alt='Selected character appearance preview';picture.style.cssText='width:100%;height:100%;object-fit:cover;object-position:center';portrait.append(picture);
const tint=document.createElement('div');tint.style.cssText='position:absolute;inset:0;mix-blend-mode:color;opacity:0;pointer-events:none';portrait.append(tint);
const accessory=document.createElement('div');accessory.style.cssText='position:absolute;top:18%;left:0;width:100%;text-align:center;font-size:38px;pointer-events:none';portrait.append(accessory);
const portraitPositions=['42% 24%','19% 43%','57% 32%'];
function updatePortrait(){
 // Crop the approved artwork into a preview, without modifying the original background.
 picture.src=document.querySelector('.stage img')?.src||document.querySelector('img')?.src||'';
 picture.style.objectPosition=portraitPositions[selected];
 tint.style.background=config.Appearance.values[customize.skin];tint.style.opacity=customize.skin===2?'0':'.22';
 picture.style.filter='hue-rotate('+([0,0,0,12,-8][customize.hairColor])+'deg) saturate('+(customize.outfit===0?1:1.18)+')';
 accessory.textContent=['','👓','🧢','🎧'][customize.gear];
}
function openControls(tab){
 const c=config[tab];panel.style.display='block';portrait.style.display='block';
 panel.replaceChildren();
 const heading=document.createElement('div');heading.textContent=tab+' • '+c.label;heading.style.cssText='font-size:17px;margin-bottom:12px';panel.append(heading);
 const grid=document.createElement('div');grid.style.cssText='display:flex;gap:8px;flex-wrap:wrap';panel.append(grid);
 c.values.forEach((v,i)=>{const btn=document.createElement('button');btn.type='button';btn.setAttribute('aria-label',c.label+' '+(i+1));btn.textContent=v.startsWith('#')?'':v;btn.style.cssText='min-width:42px;min-height:42px;border-radius:9px;border:3px solid '+(customize[c.key]===i?'#9cfa00':'#fff8')+';background:'+(v.startsWith('#')?v:'#5b2681')+';color:white;font-weight:700;padding:6px;cursor:pointer';btn.onclick=()=>{customize[c.key]=i;updatePortrait();openControls(tab)};grid.append(btn)});
 const note=document.createElement('p');note.textContent='Visual preview only. Detailed 3D face, hair and outfit editing is still in development.';note.style.cssText='font-size:12px;line-height:1.4;opacity:.9';panel.append(note);
 const close=document.createElement('button');close.textContent='Close';close.style.cssText='padding:8px 18px;border-radius:8px';close.onclick=()=>{panel.style.display='none';portrait.style.display='none'};panel.append(close);
 updatePortrait();
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openControls(b.dataset.tab));

// The approved illustration has painted-on controls; provide actual touch targets
// over every visible category and row instead of only the top navigation.
const categories=[
 ['Face',60.5,22.2,12.7,6.5,'Appearance'],
 ['Hair',60.5,29.3,12.7,6.1,'Hair'],
 ['Facial Hair',60.5,35.5,12.7,6.4,'Facial Hair'],
 ['Skin Tone',60.5,42.2,12.7,6.4,'Appearance'],

});
function addHit(name,x,y,w,h,fn){
 const b=document.createElement('button');b.type='button';b.className='hit';b.setAttribute('aria-label',name);
 b.style.cssText='position:absolute;z-index:6;left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%;background:transparent;border:0;cursor:pointer;touch-action:manipulation';
 b.onclick=fn;document.querySelector('.stage').append(b);return b;
}
categories.forEach(([name,x,y,w,h,tab])=>addHit('Customize '+name,x,y,w,h,()=>openControls(tab)));
for(let i=0;i<5;i++){
 addHit('Choose face '+(i+1),74.2+i*5,23.4,4.7,10,()=>{customize.face=i;openControls('Appearance');notify('Face '+(i+1)+' selected; 3D face editing is not ready')});
 addHit('Choose skin tone '+(i+1),74.2+i*5,40.8,4.7,7.4,()=>{customize.skin=i;openControls('Appearance')});
 addHit('Choose hairstyle '+(i+1),74.2+i*5,57.7,4.7,9.8,()=>{customize.hair=i;openControls('Hair')});
 addHit('Choose hair color '+(i+1),74.2+i*5,73.6,4.7,7.2,()=>{customize.hairColor=i;openControls('Style')});
}
const originalOpenControls=openControls;
openControls=function(tab){
 const c=config[tab];if(c && customize[c.key]===undefined)customize[c.key]=0;
 originalOpenControls(tab);
};
const oldChoose=choose;choose=function(i){oldChoose(i);updatePortrait()};
