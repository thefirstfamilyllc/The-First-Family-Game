<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The First Family — 3D Character Selection</title><style>*{box-sizing:border-box}body{margin:0;background:#12091d;color:white;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:pan-y}header{position:fixed;top:0;left:0;right:0;padding:18px 22px;background:linear-gradient(#1d0a30e8,transparent);pointer-events:none}header h1{font-size:clamp(20px,3vw,38px);margin:0;color:#d6ff82;text-shadow:0 2px 10px #000}header p{margin:4px 0;color:#eee}footer{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px max(20px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#190725 35%)}.choices{display:flex;gap:12px;justify-content:center;width:100%}button{border:2px solid #b589df;background:#4c216c;color:#fff;border-radius:14px;padding:12px 20px;font:800 16px system-ui;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{border-color:#b6ff26;box-shadow:0 0 18px #b6ff2680;background:#683093}#accept{background:#b6ff26;color:#1b0926;border-color:#f2ffc7;width:min(360px,95%)}#info{font-size:13px;color:#e5d9ef;text-align:center}#status{position:fixed;top:82px;right:15px;color:#d6ff82;font-size:13px}@media(max-width:560px){header{padding:12px}header p{font-size:12px}.choices{gap:5px}.choices button{flex:1;padding:10px 3px;font-size:13px}footer{gap:6px;padding:12px 8px max(12px,env(safe-area-inset-bottom))}#status{top:76px}}</style></head><body><canvas id="scene" aria-label="Interactive 3D character selection scene"></canvas><header><h1>THE FIRST FAMILY</h1><p>BUILD YOUR EMPIRE · CHOOSE YOUR CHARACTER</p></header><div id="status" role="status">Loading 3D world…</div><footer><div class="choices" id="choices"></div><button id="accept">✓ ACCEPT JAY</button><div id="info">Select a character, then accept to customize individually.</div></footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const names=['Jay','Esined','Jahdē'],canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#21102f');scene.fog=new THREE.Fog('#21102f',12,45);const camera=new THREE.PerspectiveCamera(40,1,.1,100);scene.add(new THREE.HemisphereLight(0xe9ddff,0x4d2a64,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-3,8,7);scene.add(light);
const mat=(color,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness:.65,metalness});function mesh(parent,geometry,color,x,y,z){const m=new THREE.Mesh(geometry,mat(color));m.position.set(x,y,z);parent.add(m);return m}const box=(p,w,h,d,c,x,y,z)=>mesh(p,new THREE.BoxGeometry(w,h,d),c,x,y,z),ball=(p,r,c,x,y,z,sx=1,sy=1,sz=1)=>{const m=mesh(p,new THREE.SphereGeometry(r,24,16),c,x,y,z);m.scale.set(sx,sy,sz);return m};
const floor=mesh(scene,new THREE.PlaneGeometry(100,100),'#352147',0,-.02,0);floor.rotation.x=-Math.PI/2;const grid=new THREE.GridHelper(80,50,'#663f8b','#3b2654');grid.position.y=.005;scene.add(grid);
for(let i=0;i<14;i++){const x=(i-7)*3.3;const height=3+(i*7%6);box(scene,2.4,height,1.5,i%2?'#392753':'#463057',x,height/2,-12);for(let k=1;k<height;k++)ball(scene,.06,'#b1ef85',x-.5,k,-11.23)}
const characters=[];function makeCharacter(i){const g=new THREE.Group();scene.add(g);const skin=['#956747','#aa7657','#a57858'][i],purple='#7027a5',pants='#252a41';const torso=ball(g,.47,purple,0,1.38,0,1,1.18,.63);const neck=ball(g,.15,skin,0,1.99,0,.75,1,.75);const head=ball(g,.35,skin,0,2.35,0,1,1.13,.86);for(const x of [-.13,.13]){ball(g,.07,'#fff',x,2.4,.28,1,.8,.55);ball(g,.034,'#30221d',x,2.4,.32)}ball(g,.075,skin,0,2.27,.32,.7,1,.7);ball(g,.10,'#6e403e',0,2.17,.31,1,.18,.2);const arms=[],legs=[];for(const x of [-1,1]){const arm=ball(g,.19,purple,x*.57,1.4,0,.85,1.8,.85);arms.push(arm);ball(g,.13,skin,x*.59,.94,.04);const leg=ball(g,.22,pants,x*.22,.55,0,1,2,.95);legs.push(leg);ball(g,.24,'#171a28',x*.22,.14,.14,1,.45,1.45)}
if(i===0){ball(g,.37,'#21171a',0,2.62,0,1,.26,1);const cap=ball(g,.4,'#55217e',0,2.71,-.02,1,.23,1);box(g,.5,.045,.28,'#55217e',0,2.65,.37)}else if(i===1){for(let j=0;j<18;j++){const a=j*Math.PI*2/18;ball(g,.16,'#21171a',Math.sin(a)*.26,2.66+Math.cos(j*3)*.08,Math.cos(a)*.22)}ball(g,.26,'#21171a',.19,2.88,-.05)}else{for(let j=0;j<24;j++){const a=j*Math.PI*2/24;ball(g,.16,'#21171a',Math.sin(a)*.28,2.68+Math.sin(j*2)*.09,Math.cos(a)*.25)}ball(g,.33,'#21171a',0,2.81,0,1,1,.9)}
const badge=box(g,.18,.14,.03,'#c9ff66',0,1.48,.31);g.position.x=(i-1)*2.2;g.userData={arms,legs,torso,head,badge};characters.push(g)}names.forEach((_,i)=>makeCharacter(i));
let selected=0;const buttons=names.map((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>select(i);document.getElementById('choices').append(b);return b});function select(i){selected=i;buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.getElementById('accept').textContent='✓ ACCEPT '+names[i].toUpperCase();characters.forEach((g,j)=>{g.userData.badge.material.color.set(j===i?'#b6ff26':'#563b74')})}select(0);document.getElementById('accept').onclick=()=>{sessionStorage.setItem('tffSelectedCharacter',String(selected));location.href='customize-character.html?character='+selected};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(0,innerWidth<600?3.2:2.8,innerWidth<600?12.5:9.5);camera.lookAt(0,1.25,0);camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const t=clock.getElapsedTime();characters.forEach((g,i)=>{g.position.y=Math.sin(t*1.7+i)*.022;g.rotation.y=Math.sin(t*.65+i)*.055;g.userData.arms[0].rotation.z=Math.sin(t*1.4+i)*.025;g.userData.arms[1].rotation.z=-Math.sin(t*1.4+i)*.025});renderer.render(scene,camera)}frame();document.getElementById('status').textContent='3D scene ready';</script></body></html>
